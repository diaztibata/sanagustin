<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Apps Web</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    .app-card {
      background: white;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 20px;
      display: flex;
      gap: 15px;
    }
    .app-card img {
      width: 64px;
      height: 64px;
      margin-top: 5px;
    }
    .app-info h2 {
      margin: 0;
      font-size: 20px;
    }
    .app-info p {
      margin: 5px 0;
      font-size: 14px;
    }
    .app-info a {
      color: #007bff;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Lista de Aplicaciones</h1>
  <div id="contenedor"></div>

  <script>
const URL = "/sanagustin/json/viernes-tecnologias.json";
const contenedor = document.getElementById("contenedor");

fetch(URL)
  .then(res => res.json())
  .then(data => {
    data.forEach(app => {
      const card = document.createElement("div");
      card.className = "app-card";

      // convertir el array de integrantes en lista
      const integrantesLista = app.integrantes
        .map(integrante => `${integrante}`)
        .join(", ");


      card.innerHTML = `
        <img src="${app.icono}" alt="Icono de ${app.nombreapp}" />
        <div class="app-info">
          <h2>${app.nombreapp}</h2>
          <p><strong>Descripción:</strong> ${app.descripcion}</p>
          <p><strong>Integrantes:</strong> ${integrantesLista}</p>
          <p><strong>Actividad:</strong> ${app.actividad}</p>
          <p><a href="${app.url}" target="_blank">Ver archivo</a></p>
        </div>
      `;

      contenedor.appendChild(card);
    });
  })
  .catch(error => {
    contenedor.innerHTML = `<p>Error al cargar los datos: ${error}</p>`;
    console.error("Error cargando JSON:", error);
  });


</script>
</body>
</html>
